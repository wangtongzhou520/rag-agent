[project]
name = "ragent"
version = "0.1.0"
description = "Ragent AI — Agentic RAG platform built with Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "PyYAML",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pgvector",
    "redis>=5",
    "httpx",
    "PyJWT",
    "structlog",
    "fastmcp>=3,<4",
    "boto3",
    "uuid-utils",
    "filetype",
    "openpyxl",
    "python-docx",
    "markdown-it-py",
    "chardet",
    "beautifulsoup4",
]

[dependency-groups]
dev = [
    "asgi-lifespan",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
