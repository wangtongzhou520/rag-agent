# Ragent 单文件配置（本地开发占位；敏感项留空，用 RAGENT_ 前缀环境变量覆盖，嵌套用 __）
server:
  port: 9090
  root_path: /api/ragent

datasource:
  host: localhost
  port: 5432
  database: ragagent
  username: postgres
  password: ""

redis:
  host: localhost
  port: 6379
  database: 0
  password: ""
  key_prefix: "ragent:"

# 数据库和 Redis 配置完成后再启用；jwt_secret 请通过环境变量注入：
# RAGENT_AUTH__JWT_SECRET=...
auth:
  enabled: false
  jwt_secret: ""
  token_ttl_seconds: 2592000
  header_name: Authorization
  development_user_id: 0

storage:
  local_dir: resources/uploads

ai:
  # provider 连接配置；api_key 留空，用环境变量覆盖，例如：
  #   RAGENT_AI__PROVIDERS__BAILIAN__API_KEY=sk-...
  providers:
    ollama:
      url: http://localhost:11434
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    bailian:
      url: https://ws-95otow917zuyeam7.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api_key: ""
      endpoints:
        chat: /chat/completions
        embedding: /embeddings
    siliconflow:
      url: https://api.siliconflow.cn
      api_key: ""
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
    aihubmix:
      url: https://aihubmix.com
      api_key: ""
      endpoints:
        chat: /v1/chat/completions
        embedding: /v1/embeddings
  chat:
    # 物理模型注册表（id 缺省回退 provider::model），档位 candidates 引用这里的 id，顺序即容错顺序
    candidates:
      - { id: qwen-plus,   provider: bailian,     model: qwen-plus-latest }
      - { id: qwen-flash,  provider: bailian,     model: qwen-flash }
      - { id: qwen3-local, provider: ollama,      model: "qwen3:8b-fp16" }
      - { id: qwen3-max,   provider: bailian,     model: qwen3-max, supports_thinking: true }
      - { id: glm-4.7,     provider: siliconflow, model: Pro/zai-org/GLM-4.7, supports_thinking: true }
      - { id: gpt-5.4,     provider: aihubmix,    model: gpt-5.4 }
    fast:
      candidates: [qwen-flash, qwen-plus, qwen3-local]
      timeout_ms: 5000
    standard:
      candidates: [qwen3-max, qwen-plus, qwen3-local, gpt-5.4]
      timeout_ms: 30000
    deep:
      candidates: [qwen3-max, glm-4.7]
      timeout_ms: 120000
  embedding:
    # default_model 置顶，其余按 (priority, id) 排序；候选维度须 == rag.default.dimension (1536)
    default_model: qwen3.7-text-embedding
    candidates:
      - { id: qwen3.7-text-embedding, provider: bailian,     model: qwen3.7-text-embedding,         dimension: 1536, priority: 0 }
      - { id: qwen-emb-8b,            provider: siliconflow, model: Qwen/Qwen3-Embedding-8B,       dimension: 1536, priority: 1 }
      - { id: qwen-emb-local,         provider: ollama,      model: "qwen3-embedding:8b-fp16",     dimension: 1536, priority: 2 }
      - { id: text-embedding-3-large, provider: aihubmix,    model: text-embedding-3-large,        dimension: 1536, priority: 3 }
  rerank:
    candidates: []
  selection:
    failure_threshold: 2
    open_duration_ms: 30000
  stream:
    message_chunk_size: 5

rag:
  default:
    dimension: 1536
    top_k: 10
    sse_timeout_ms: 300000
  recall_budget: 20
  fusion:
    rrf_k: 20
    channel_weights:
      vector: 1.0
      keyword: 1.0
      graph: 0.8
      web: 0.5
  retrieval:
    timeout_ms: 15000
  query_rewrite:
    enabled: true
    timeout_ms: 5000
  rerank_candidate_limit: 40
  scope:
    supplement_ratio: 0.25
  intent:
    confidence_threshold: 0.6
  guidance:
    enabled: true
    ambiguity_score_ratio: 0.8
    ambiguity_margin: 0.15
    max_options: 6
  vector:
    type: pg              # pgvector（Milvus 二期预留）
  keyword:
    type: none            # none | es
  graph:
    type: none            # none | lightrag
  engine:
    type: workflow        # workflow | agent（agent 仅预留）
  memory:
    history_keep_turns: 8
  rate_limit:
    enabled: true

logging:
  level: INFO
